version: 2

models:
  - name: fact_control_charts
    description: "Gold: Levey-Jennings chart with Westgard rules per XRF reading"
    columns:
      - name: id
        tests: [unique, not_null]
      - name: qc_status
        tests:
          - not_null
          - accepted_values:
              values: ["in_control", "warning", "out_of_control"]
      - name: z_score
        tests: [not_null]

  - name: fact_calibration_status
    description: "Gold: calibration status per instrument/batch — XRF, HPLC, Balance"
    columns:
      - name: calibration_status
        tests:
          - not_null
          - accepted_values:
              values: ["in_control", "warning", "out_of_control"]
      - name: instrument_type
        tests:
          - not_null
          - accepted_values:
              values: ["XRF", "HPLC", "Balance"]
      - name: n_readings
        tests: [not_null]

  - name: dim_instruments
    description: "Gold: instrument dimension table"
    columns:
      - name: instrument_id
        tests: [unique, not_null]
      - name: instrument_type
        tests: [not_null]
